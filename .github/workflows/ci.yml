name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q bot analyzer core

      - name: Import check
        run: python -c "import bot.main, bot.handlers.start, bot.handlers.analyze, bot.handlers.mirror, bot.handlers.group_guard, analyzer.url_parser, analyzer.whois_checker, analyzer.external_apis, analyzer.analysis, core.config, core.database, core.mirror_manager"

      - name: Run tests
        run: python -m pytest -v